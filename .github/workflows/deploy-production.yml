name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.tag }}
        run: |
          services=(api-gateway fashion-transform scene-recommender posture-director media-storage location-service)
          for svc in "${services[@]}"; do
            docker build -t $ECR_REGISTRY/$svc:$IMAGE_TAG ./services/$svc
            docker push $ECR_REGISTRY/$svc:$IMAGE_TAG
          done

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name fashion-assistant-prod --region us-east-1

      - name: Deploy to EKS
        run: kubectl apply -f infrastructure/k8s/ --recursive
