apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: fashion-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: fashion-assistant/api-gateway:latest
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: USER_SERVICE_URL
              value: http://user-service:8081/graphql
            - name: WARDROBE_SERVICE_URL
              value: http://wardrobe-service:8082/graphql
            - name: SOCIAL_SERVICE_URL
              value: http://social-service:8083/graphql
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: fashion-assistant
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 4000
      targetPort: 4000
