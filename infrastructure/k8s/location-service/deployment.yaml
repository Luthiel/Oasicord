apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: fashion-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: location-service
  template:
    metadata:
      labels:
        app: location-service
    spec:
      containers:
        - name: location-service
          image: fashion-assistant/location-service:latest
          ports:
            - containerPort: 8088
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: location-service
  namespace: fashion-assistant
spec:
  selector:
    app: location-service
  ports:
    - port: 8088
      targetPort: 8088
