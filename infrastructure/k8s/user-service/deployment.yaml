apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: fashion-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: fashion-assistant/user-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - secretRef:
                name: user-service-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: fashion-assistant
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
